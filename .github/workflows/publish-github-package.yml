name: Publish GitHub Package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish-github-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@edward124689'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Prepare scoped package metadata
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'dist/ngx-email-studio/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.name = '@edward124689/ngx-email-studio';
          pkg.publishConfig = {
            ...(pkg.publishConfig || {}),
            registry: 'https://npm.pkg.github.com',
            access: 'public'
          };
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          node -e "const p=require('./dist/ngx-email-studio/package.json'); console.log(`${p.name}@${p.version}`)"

      - name: Publish to GitHub Packages
        run: npm publish --access public ./dist/ngx-email-studio
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
